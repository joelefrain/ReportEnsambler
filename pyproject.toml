[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-ensambler"
version = "0.2.0"
description = "Generador de reportes PDF con plantillas TOML."
requires-python = ">=3.10"
dependencies = [
  "tomli>=0.1",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "reportlab>=4.0",
  "svglib>=1.5",
  "pypdf>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
